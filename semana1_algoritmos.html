<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Semana 1 - Algoritmos</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}


body{

min-height:100vh;

background:
linear-gradient(120deg,#101b68,#4a38a8);

color:white;

}



.contenedor{

width:85%;

max-width:1200px;

margin:50px auto;

background:rgba(255,255,255,.15);

padding:40px;

border-radius:30px;

backdrop-filter:blur(15px);

}



h1{

text-align:center;

font-size:35px;

}



.subtitulo{

text-align:center;

margin:15px 0 40px;

color:#61dafb;

}



.info{

background:rgba(255,255,255,.18);

padding:25px;

border-radius:20px;

margin-bottom:30px;

}



.info h2{

margin-bottom:15px;

}



.evidencias{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:25px;

}



.card{


background:rgba(255,255,255,.2);

padding:25px;

border-radius:20px;

border:1px solid rgba(255,255,255,.3);

}



.card h3{

margin-bottom:15px;

}



.boton{

display:inline-block;

margin-top:20px;

padding:10px 25px;

border-radius:20px;

border:1px solid white;

color:white;

text-decoration:none;

}



.boton:hover{

background:white;

color:#33258c;

}


</style>

</head>


<body>



<div class="contenedor">


<h1>
Semana 1
</h1>


<p class="subtitulo">
Arreglos Bidimensionales
</p>



<div class="info">


<h2>
Descripción
</h2>


<p>
Representación y aplicación de arreglos en programas básicos.
</p>


</div>




<div class="evidencias">



<div class="card">

<h3>
Trabajo realizado
</h3>

<p>
Aquí se colocará la imagen o captura del desarrollo realizado.
</p>


<a href="#" class="boton">
Ver archivo
</a>


</div>




<div class="card">

<h3>
Código fuente
</h3>


<p>
Proyecto desarrollado durante la semana.
</p>


<a href="#" class="boton">
Abrir código
</a>


</div>




</div>


</div>


</body>

</html>
