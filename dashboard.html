<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Portafolio Estudiantil</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}


body{

min-height:100vh;

background:
linear-gradient(120deg,#101b68,#4a38a8);

color:white;

}



/* HEADER IGUAL AL RESTO */


header{

width:100%;

padding:18px 55px;

display:flex;

align-items:center;

position:relative;

}



.logo{

display:flex;

align-items:center;

gap:15px;

}



.logo img{

width:55px;

}



.logo h1{

font-size:24px;

font-weight:800;

}



.logo p{

font-size:13px;

}



.menu{

position:absolute;

left:50%;

transform:translateX(-50%);

display:flex;

gap:55px;

}



.menu a{

color:white;

text-decoration:none;

font-size:16px;

font-weight:700;

}



.menu a:hover{

color:#61dafb;

}



/* CONTENIDO */


.dashboard{


width:85%;

margin:70px auto;

text-align:center;


}



.dashboard h2{

font-size:40px;

margin-bottom:15px;

}



.dashboard p{

font-size:18px;

opacity:.9;

}



.cursos{


margin-top:50px;

display:flex;

justify-content:center;

gap:50px;

}



/* TARJETAS */


.card{


width:350px;


padding:35px;


background:

rgba(255,255,255,.15);


backdrop-filter:blur(15px);


border-radius:30px;


border:1px solid rgba(255,255,255,.3);


box-shadow:

0 20px 40px rgba(0,0,0,.3);


transition:.4s;


}



.card:hover{

transform:translateY(-10px);

background:rgba(255,255,255,.25);

}




.card h3{

font-size:25px;

line-height:1.4;

}



.card .descripcion{


margin:25px 0;

line-height:1.6;


}



.datos{


font-size:18px;

font-weight:700;

margin-bottom:25px;


}




.boton{


display:inline-block;


padding:12px 35px;


border-radius:25px;


background:#61dafb;


color:#08135c;


font-weight:800;


text-decoration:none;


}




</style>


</head>
