<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Algoritmos y Estructura de Datos</title>


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    min-height:100vh;

    background:
    linear-gradient(120deg,#101b68,#4a38a8);

    color:white;

}



/* CONTENEDOR PRINCIPAL */

.contenedor{


    width:85%;

    max-width:1400px;

    margin:60px auto;


    background:rgba(255,255,255,.15);

    backdrop-filter:blur(15px);


    border-radius:35px;


    padding:45px;


    box-shadow:
    0 25px 50px rgba(0,0,0,.3);


}




h1{


text-align:center;

font-size:38px;

margin-bottom:10px;


}



.descripcion{

text-align:center;

font-size:17px;

margin-bottom:45px;

opacity:.9;

}





/* UNIDAD */


.unidad{


background:rgba(255,255,255,.18);

border-radius:25px;

overflow:hidden;


border:1px solid rgba(255,255,255,.3);


}





.boton-unidad{


width:100%;


padding:25px 35px;


background:transparent;


border:none;


color:white;


display:flex;


justify-content:space-between;


align-items:center;


font-size:25px;


font-weight:700;


cursor:pointer;


}





.boton-unidad:hover{


background:rgba(255,255,255,.15);


}





.flecha{


font-size:28px;


}




/* CONTENIDO OCULTO */


.contenido{


display:none;


padding:30px 40px;


background:rgba(0,0,0,.10);


}



.contenido h2{


font-size:24px;

margin-bottom:15px;


}



.semana{


background:rgba(255,255,255,.15);


padding:25px;


border-radius:20px;


}



.semana h3{


font-size:22px;


margin-bottom:10px;


}




.semana p{


font-size:17px;


margin-bottom:20px;


}





.pdf{


display:inline-block;


padding:12px 30px;


border-radius:25px;


border:1px solid white;


color:white;


text-decoration:none;


font-weight:bold;


transition:.3s;


}



.pdf:hover{


background:white;

color:#392c92;


}




</style>


</head>



<body>




<section class="contenedor">


<h1>
Algoritmos y Estructura de Datos
</h1>


<p class="descripcion">

Explora las unidades del curso, contenidos y evidencias de aprendizaje.

</p>





<div class="unidad">



<button class="boton-unidad" onclick="abrirUnidad()">


Unidad I

<span class="flecha" id="flecha">
⌄
</span>


</button>





<div class="contenido" id="contenido">


<h2>
Conceptos iniciales de algoritmos y estructuras de datos
</h2>



<div class="semana">


<h3>
Semana 1
</h3>


<p>

Arreglos Bidimensionales

</p>



<a class="pdf" 
href="documentos/Trabajo_Semana1.pdf"
target="_blank">

Ver documento PDF →

</a>



</div>



</div>



</div>





</section>







<script>


function abrirUnidad(){


let contenido=document.getElementById("contenido");

let flecha=document.getElementById("flecha");



if(contenido.style.display==="block"){


contenido.style.display="none";


flecha.innerHTML="⌄";


}

else{


contenido.style.display="block";


flecha.innerHTML="⌃";


}


}



</script>




</body>

</html>
