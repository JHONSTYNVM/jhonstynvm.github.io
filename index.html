<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portafolio Académico - Jhonstyn Vega</title>


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}



body{

    min-height:100vh;

    background:
    linear-gradient(135deg,#07185c,#4b3ca7);

    color:white;

}


/* HEADER */

header{

    width:100%;

    height:90px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

}


/* LOGO PEQUEÑO */

.logo-header{

    position:absolute;

    left:50px;

    top:20px;

    display:flex;

    align-items:center;

    gap:15px;

}



.logo-header img{

    width:45px;

}



.logo-header h1{

    font-size:22px;

    letter-spacing:1px;

}


.logo-header p{

    font-size:13px;

    opacity:.8;

}




/* MENU */

nav{

    display:flex;

    gap:45px;

}



nav a{

    color:white;

    text-decoration:none;

    font-size:17px;

    font-weight:600;

    transition:.3s;

}



nav a:hover{

    color:#6ee7ff;

}



/* CONTENIDO CENTRAL */


.contenedor{


    height:calc(100vh - 90px);

    display:flex;

    justify-content:center;

    align-items:center;


}




.hero{


    display:flex;

    align-items:center;

    justify-content:center;

    gap:80px;

    width:90%;

}



/* TARJETAS CURSOS */


.curso{


    width:260px;

    padding:35px 25px;

    border-radius:25px;


    background:

    rgba(255,255,255,0.15);


    backdrop-filter:blur(15px);


    text-align:center;


    border:1px solid rgba(255,255,255,.3);


    box-shadow:

    0 20px 40px rgba(0,0,0,.25);


    transition:.4s;


}



.curso:hover{

    transform:translateY(-15px);

    background:rgba(255,255,255,.25);

}



.curso h2{

    font-size:20px;

    line-height:1.4;

}





/* LOGO GRANDE */


.logo-central{


    width:420px;

    height:420px;

    object-fit:contain;


    filter:

    drop-shadow(0 25px 35px rgba(0,0,0,.5));


    animation:flotar 4s infinite ease-in-out;


}




@keyframes flotar{


    0%{

        transform:translateY(0);

    }


    50%{

        transform:translateY(-15px);

    }


    100%{

        transform:translateY(0);

    }


}




/* RESPONSIVE */


@media(max-width:1000px){


.hero{

    flex-direction:column;

    gap:30px;

}


.logo-central{

    width:250px;

}


header{

    height:auto;

}


.logo-header{

    position:relative;

    left:auto;

}


}



</style>


</head>



<body>



<header>


<div class="logo-header">


<img src="logo_upla.png">


<div>

<h1>
PORTAFOLIO ESTUDIANTIL
</h1>


<p>
Taller de Desarrollo de Aplicaciones I
<br>
Algoritmos y Estructura de Datos
</p>


</div>


</div>




<nav>


<a href="#">Inicio</a>

<a href="sobremi.html">Sobre mí</a>

<a href="#">Dashboard</a>


</nav>



</header>





<div class="contenedor">


<section class="hero">



<div class="curso">

<h2>

Taller de Desarrollo<br>
de Aplicaciones I

</h2>


</div>





<img src="logo_upla.png" class="logo-central">





<div class="curso">


<h2>

Algoritmos<br>
y Estructura de Datos

</h2>


</div>



</section>



</div>




</body>


</html>
