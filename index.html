<!DOCTYPE html>

<title>Portafolio Estudiantil - Jhonstyn Vega</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    min-height:100vh;
    background:linear-gradient(135deg,#071A52,#3B2B80,#5C6BC0);
    color:white;

}


/* MENU */

nav{

    width:100%;
    padding:25px 70px;
    display:flex;
    justify-content:space-between;
    align-items:center;

}


.logo{

    display:flex;
    align-items:center;
    gap:15px;

}


.logo img{

    width:55px;

}


.logo h2{

    font-size:20px;

}



.menu a{

    color:white;
    text-decoration:none;
    margin-left:30px;
    font-size:17px;

}



/* PORTADA */


.container{

    height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;

}


.card{

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    width:600px;
    padding:45px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.3);

}



.card h1{

    font-size:40px;
    margin-bottom:15px;

}



.card h3{

    font-weight:400;
    margin-bottom:20px;

}



.card p{

    font-size:18px;
    line-height:1.6;

}



.buttons{

    margin-top:30px;

}



button{

    padding:15px 30px;
    border:none;
    border-radius:25px;
    margin:10px;
    cursor:pointer;
    font-size:16px;

}


.btn1{

    background:#ffffff;
    color:#17245f;

}


.btn2{

    background:#6ee7ff;
    color:#08205c;

}


</style>

</head>


<body>


<nav>


<div class="logo">

</div>


<div class="menu">

<a href="#">Dashboard</a>

</div>


</nav>

</h3>


<p>

</p>

</div>


</div>


</section>
